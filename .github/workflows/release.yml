# Construye Toma para Windows y Mac y publica la versión en GitHub Releases.
# Se dispara al subir una etiqueta de versión:  git tag v0.1.1 && git push --tags
name: Publicar Toma
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - name: Empaquetar y publicar
        run: npx electron-builder ${{ matrix.os == 'macos-latest' && '--mac' || '--win' }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sin certificado de Apple la app de Mac sale sin firmar.
          # Al tenerlo, quitar la línea siguiente y añadir CSC_LINK, CSC_KEY_PASSWORD,
          # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID como secretos.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
